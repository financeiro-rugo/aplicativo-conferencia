<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e6a4e">
<title>Conferência de Carga</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
<script>
// Bibliotecas: usa a cópia da pasta "libs" se existir; se não, baixa da internet.
// Sem nenhuma das duas, o app funciona: digite os produtos na mão e a planilha sai em .csv.
function carregarLib(opcoes,aoCarregar){
  var i=0;
  (function proxima(){
    if(i>=opcoes.length)return;
    var o=opcoes[i++],s=document.createElement("script");
    s.src=o.src;
    s.onload=function(){if(aoCarregar)aoCarregar(o);};
    s.onerror=proxima;
    document.head.appendChild(s);
  })();
}
carregarLib([
  {src:"libs/pdf.min.js",worker:"libs/pdf.worker.min.js"},
  {src:"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",worker:"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"}
],function(o){window.__pdfWorker=o.worker;});
carregarLib([
  {src:"libs/xlsx.full.min.js"},
  {src:"https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"}
]);
</script>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="overlays"></div>
<input type="file" id="pdfIn" accept="application/pdf,.pdf" hidden>
<input type="file" id="photoIn" accept="image/*" capture="environment" hidden>
<input type="file" id="bkIn" accept="application/json,.json" hidden>
<script src="app.js"></script>
</body>
</html>
